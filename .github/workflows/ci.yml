name: Lua CI

on:
  push:
  pull_request:

jobs:
  runtime:
    name: Lua ${{ matrix.lua }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lua:
          - "5.2.4"
          - "5.3.6"
          - "5.4.9"
          - "5.5.1"
    steps:
      - uses: actions/checkout@v7
      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: ${{ matrix.lua }}
      - name: Run regression suite
        run: lua test_funkmoon.lua

  typecheck:
    name: LuaLS type examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install LuaLS
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/lua-language-server"
          curl --fail --location --silent --show-error \
            https://github.com/LuaLS/lua-language-server/releases/download/3.19.2/lua-language-server-3.19.2-linux-x64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP/lua-language-server"
      - name: Check annotations and type propagation
        run: >-
          "$RUNNER_TEMP/lua-language-server/bin/lua-language-server"
          --check=.
          --checklevel=Warning
          --check_format=pretty
          --logpath="$RUNNER_TEMP/luals-logs"
      - name: Verify max/min preserve element constraints
        shell: bash
        run: |
          set +e
          "$RUNNER_TEMP/lua-language-server/bin/lua-language-server" \
            --check=. \
            --configpath=.luarc-constraints.json \
            --checklevel=Warning \
            --check_format=json \
            --check_out_path="$RUNNER_TEMP/luals-invalid.json" \
            --logpath="$RUNNER_TEMP/luals-invalid-logs"
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "LuaLS accepted invalid max/min inputs."
            exit 1
          fi
          python3 scripts/assert_luals_constraints.py "$RUNNER_TEMP/luals-invalid.json"
